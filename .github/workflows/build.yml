
name: Build AZN Flight Radar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android project
        run: |
          cordova create app com.azn.flightradar "AZN Flight Radar"
          mkdir -p app/www
          cp index.html config.js subscription.js app/www/
          cp config.xml app/config.xml
          cd app
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZN-Flight-Radar-debug-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
